name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Run by hand to test the macOS signing and notarization without a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin JUCE to required commit
        run: |
          cd libs/JUCE
          git fetch origin 7c89e11f6b7316c369f3d3f22227c60e816e738b
          git checkout 7c89e11f6b7316c369f3d3f22227c60e816e738b

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install FFmpeg via vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install ffmpeg[core,avformat,avcodec,swscale,swresample,mp3lame]:x64-windows

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build --config Release

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = "build/OpenDaw_artefacts/Release/OpenDaw.exe"
          windeployqt --release --no-translations --no-opengl-sw $exe

      - name: Bundle FFmpeg DLLs
        shell: pwsh
        run: |
          $dest = "build/OpenDaw_artefacts/Release"
          $vcpkgBin = "C:/vcpkg/installed/x64-windows/bin"
          Get-ChildItem "$vcpkgBin" -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName $dest -Force
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path "build/OpenDaw_artefacts/Release/*" -DestinationPath "OpenDaw-v${version}-portable.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            /DMyAppVersion="$version" `
            /DSourceDir="$PWD\build\OpenDaw_artefacts\Release" `
            /DOutputDir="$PWD" `
            /DOutputBaseFilename="OpenDaw-v${version}-setup" `
            /DLicenseDir="$PWD" `
            "installer\opendaw.iss"
          # Fallback: move from installer\Output if Inno Setup ignored OutputDir
          if (-not (Test-Path "OpenDaw-v${version}-setup.exe")) {
            $found = Get-ChildItem -Recurse -Filter "*setup*.exe" | Select-Object -First 1
            if ($found) { Move-Item $found.FullName "OpenDaw-v${version}-setup.exe" }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            OpenDaw-v*-portable.zip
            OpenDaw-v*-setup.exe

  build-macos:
    runs-on: macos-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_SIGNING_ID: ${{ secrets.MACOS_SIGNING_IDENTITY != '' }}
      HAS_NOTARIZE_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
      HAS_NOTARIZE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin JUCE to required commit
        run: |
          cd libs/JUCE
          git fetch origin 7c89e11f6b7316c369f3d3f22227c60e816e738b
          git checkout 7c89e11f6b7316c369f3d3f22227c60e816e738b

      # Qt 6.8.0 links Apple's AGL framework, which the Xcode 26 SDK no longer ships.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          aqtversion: '==3.3.*'
          cache: true

      - name: Install FFmpeg
        run: brew install ffmpeg pkg-config

      - name: Extract version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=test-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle FFmpeg dylibs
        run: |
          APP="build/OpenDaw_artefacts/Release/OpenDaw.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS"
          for lib in avformat avcodec avutil swscale swresample; do
            DYLIB=$(brew --prefix ffmpeg)/lib/lib${lib}.dylib
            if [ -f "$DYLIB" ]; then
              REAL=$(readlink -f "$DYLIB")
              cp "$REAL" "$FRAMEWORKS/"
              BASENAME=$(basename "$REAL")
              install_name_tool -id "@rpath/$BASENAME" "$FRAMEWORKS/$BASENAME"
              install_name_tool -change "$REAL" "@rpath/$BASENAME" "$APP/Contents/MacOS/OpenDaw" 2>/dev/null || true
            fi
          done

      - name: Deploy Qt into app bundle
        run: |
          "${{ env.QT_ROOT_DIR }}/bin/macdeployqt" "build/OpenDaw_artefacts/Release/OpenDaw.app"

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PWD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PWD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          # The Developer ID intermediate isn't always in the runner's keychains.
          curl -fsSL -o DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k build.keychain || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PWD" build.keychain
          rm certificate.p12 DeveloperIDG2CA.cer
          security find-identity -v -p codesigning build.keychain

      - name: Code-sign app bundle
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          APP="build/OpenDaw_artefacts/Release/OpenDaw.app"
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "No signing identity found: applying an ad-hoc signature"
            codesign --force --deep --sign - "$APP"
            exit 0
          fi
          SIGN=(codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY")
          # Inside out: loose libraries and plugins, then frameworks, then the app.
          find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
            | xargs -0 -n 1 "${SIGN[@]}"
          find "$APP/Contents/Frameworks" -maxdepth 1 -type d -name "*.framework" -print0 \
            | xargs -0 -n 1 "${SIGN[@]}"
          # Bundled plugins (Surge XT), signed again with our identity.
          if [ -d "$APP/Contents/PlugIns" ]; then
            find "$APP/Contents/PlugIns" -maxdepth 1 -type d -name "*.vst3" -print0 \
              | xargs -0 -n 1 "${SIGN[@]}"
          fi
          "${SIGN[@]}" --entitlements packaging/macos/OpenDaw.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --entitlements - "$APP"

      - name: Write notarization helper
        run: |
          # Notarizes a file, prints Apple's log if it's rejected, and staples the ticket.
          cat > "$RUNNER_TEMP/notarize.sh" <<'SCRIPT'
          set -euo pipefail
          FILE="$1"; STAPLE="$2"
          if [ -n "${ASC_KEY_P8:-}" ]; then
            printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            AUTH=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          else
            AUTH=(--apple-id "$MACOS_NOTARIZE_APPLE_ID" --password "$MACOS_NOTARIZE_PASSWORD" --team-id "$MACOS_NOTARIZE_TEAM_ID")
          fi
          OUT=$(xcrun notarytool submit "$FILE" "${AUTH[@]}" --wait --timeout 30m --output-format json) || true
          echo "$OUT"
          ID=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$STAPLE"
          SCRIPT

      - name: Notarize app
        if: env.HAS_SIGNING_ID == 'true' && (env.HAS_NOTARIZE_KEY == 'true' || env.HAS_NOTARIZE_ID == 'true')
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: |
          APP="build/OpenDaw_artefacts/Release/OpenDaw.app"
          ditto -c -k --keepParent "$APP" OpenDaw-notarize.zip
          bash "$RUNNER_TEMP/notarize.sh" OpenDaw-notarize.zip "$APP"
          rm OpenDaw-notarize.zip
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package DMG
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          hdiutil create -volname "OpenDaw" \
            -srcfolder "build/OpenDaw_artefacts/Release/OpenDaw.app" \
            -ov -format UDZO \
            "OpenDaw-v${VERSION}-mac.dmg"

      - name: Sign DMG
        if: env.HAS_SIGNING_ID == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" --timestamp \
            "OpenDaw-v${VERSION}-mac.dmg"

      - name: Notarize DMG
        if: env.HAS_SIGNING_ID == 'true' && (env.HAS_NOTARIZE_KEY == 'true' || env.HAS_NOTARIZE_ID == 'true')
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: |
          DMG="OpenDaw-v${{ steps.version.outputs.VERSION }}-mac.dmg"
          bash "$RUNNER_TEMP/notarize.sh" "$DMG" "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"

      - name: Remove signing keychain
        if: always() && env.HAS_SIGNING_CERT == 'true'
        run: security delete-keychain build.keychain || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: OpenDaw-v*-mac.dmg

  build-linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin JUCE to required commit
        run: |
          cd libs/JUCE
          git fetch origin 7c89e11f6b7316c369f3d3f22227c60e816e738b
          git checkout 7c89e11f6b7316c369f3d3f22227c60e816e738b

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libcurl4-openssl-dev libfontconfig1-dev \
            libwebkit2gtk-4.0-dev libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev \
            libcups2-dev libssl-dev libxkbcommon-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            ninja-build libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Package AppImage
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/opendaw
          cp build/OpenDaw_artefacts/Release/OpenDaw AppDir/usr/bin/
          cp -r build/OpenDaw_artefacts/Release/soundfonts AppDir/usr/share/opendaw/
          if [ -d build/OpenDaw_artefacts/Release/plugins ]; then
            cp -r build/OpenDaw_artefacts/Release/plugins AppDir/usr/share/opendaw/
          fi

          cat > OpenDaw.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=OpenDaw
          Exec=OpenDaw
          Icon=OpenDaw
          Categories=Audio;AudioVideo;Music;
          Comment=Free, open-source Digital Audio Workstation
          EOF

          convert resources/icon.png -resize 256x256 OpenDaw.png

          export QMAKE="${{ env.QT_ROOT_DIR }}/bin/qmake"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export VERSION="$VERSION"

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/OpenDaw \
            --desktop-file OpenDaw.desktop \
            --icon-file OpenDaw.png \
            --plugin qt \
            --output appimage

          mv OpenDaw-*.AppImage "OpenDaw-v${VERSION}-linux-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: OpenDaw-v*-linux-x86_64.AppImage

  release:
    needs: [build-windows, build-macos, build-linux]
    if: always() && !cancelled() && github.event_name == 'push' && contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenDaw ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            OpenDaw-v*-portable.zip
            OpenDaw-v*-setup.exe
            OpenDaw-v*-mac.dmg
            OpenDaw-v*-linux-x86_64.AppImage
